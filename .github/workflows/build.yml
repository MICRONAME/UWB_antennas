name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows runner provides Times New Roman used by article.tex.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Build article PDF
        run: |
          mkdir -p build
          tectonic -o build article.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: UWB-antennas-article-pdf
          path: build/article.pdf
          if-no-files-found: error
          retention-days: 30
